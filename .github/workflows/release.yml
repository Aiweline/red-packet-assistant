name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  android:
    name: Android package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib test
      - run: flutter test
      - run: flutter build apk --release
      - name: Android native tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Name package
        run: cp build/app/outputs/flutter-apk/app-release.apk "red-packet-assistant-android-${GITHUB_REF_NAME}-development-signed.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-package
          path: red-packet-assistant-android-*.apk

  macos:
    name: macOS package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate macOS build configuration
        run: flutter build macos --debug --config-only
      - name: macOS native tests
        run: xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug test -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
      - run: flutter build macos --release
      - name: Apply stable ad-hoc macOS signature
        run: macos/sign_adhoc.sh "build/macos/Build/Products/Release/红包助手.app"
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/红包助手.app" "red-packet-assistant-macos-${GITHUB_REF_NAME}-adhoc-signed.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-package
          path: red-packet-assistant-macos-*.zip

  ios:
    name: iOS unsigned IPA package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          ditto "build/ios/iphoneos/Runner.app" "Payload/Runner.app"
          test -f "Payload/Runner.app/Info.plist"
          zip -qry "red-packet-assistant-ios-${GITHUB_REF_NAME}-unsigned.ipa" Payload
          unzip -t "red-packet-assistant-ios-${GITHUB_REF_NAME}-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-package
          path: red-packet-assistant-ios-*.ipa

  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Windows automation policy tests
        shell: pwsh
        run: |
          cmake --build build\windows\x64 --config Release --target automation_policy_test
          & build\windows\x64\runner\Release\automation_policy_test.exe
      - name: Package application
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "red-packet-assistant-windows-$env:GITHUB_REF_NAME-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-package
          path: red-packet-assistant-windows-*.zip

  publish:
    name: Publish GitHub Release
    needs: [android, ios, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            红包助手四端开发版本包 / Development packages for all four platforms.

            - Android APK 使用开发签名，仅供本人设备评估。
            - iOS IPA 未签名，必须使用自己的 Apple 开发证书和描述文件重新签名后才能安装。
            - macOS ZIP 使用稳定本地身份临时签名，未使用 Developer ID 签名，也未公证。
            - Windows ZIP 未签名。

            Android is development-signed; the iOS IPA is unsigned and requires re-signing; macOS is ad-hoc signed but not notarized; Windows is unsigned. Verify downloads with `SHA256SUMS.txt` and review the source before enabling automation.
          files: release-assets/*
